<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grading System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 50px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #2d3748;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 35px;
        }

        .student-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .student-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
            transition: 0.3s;
        }

        .student-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .student-card h2 {
            margin-bottom: 15px;
            color: #4a5568;
        }

        .marks {
            font-size: 18px;
            margin: 10px 0;
        }

        .grade {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            background: #edf2f7;
            color: #2d3748;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #718096;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Grading System</h1>

        <p class="subtitle">
            JavaScript Fundamentals — ES6+
        </p>

        <div id="result" class="student-container"></div>

        <footer>
            Created using JavaScript, Objects, Arrays & Functions
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
